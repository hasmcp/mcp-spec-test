# Builds the mcp-spec-test image on every push and PR (catching a broken
# Dockerfile before anyone tries to pull it), and pushes it to Docker Hub on
# main and on version tags — mirroring publish.yml's approach to npm: the
# credentials are an explicit secret added when someone is ready, not a
# requirement for the workflow to stay green.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-spec-test:ci

      # A build that produces an image which cannot run the suite is a
      # failure, whether or not anything gets pushed.
      - name: the image runs mcp-spec-test
        run: |
          docker run --rm mcp-spec-test:ci --help > /dev/null
          docker run --rm mcp-spec-test:ci -c "npx -y @modelcontextprotocol/server-everything" --disable-telemetry=1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No credentials is a deliberate state, not a broken build: the
      # repository can sit for a while before anyone wants a release. Skip
      # with a notice so the run stays green and the reason is visible,
      # rather than failing until the secrets appear.
      - name: should this run publish?
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set, so nothing is pushed. Add the secrets to enable image publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: log in to Docker Hub
        if: steps.check.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image lives under whichever Docker Hub account owns the token,
      # since that is the account that will actually receive the push.
      - name: compute tags
        if: steps.check.outputs.publish == 'true'
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="$DOCKERHUB_USERNAME/mcp-spec-test"
          TAGS="$IMAGE:latest"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAGS="$TAGS,$IMAGE:${GITHUB_REF_NAME#v}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: build and push
        if: steps.check.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
