# Publishes to npm when a version tag is pushed.
#
# Deliberately *not* on push to main. The normal state of a push to main is "do
# not publish", and a workflow whose default is to publish makes that a matter of
# remembering — one merge with a bumped version and the package is on the
# registry, where npm's unpublish window makes it close to irreversible.
#
# So publishing is an explicit act with its own gesture:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# which means main can be pushed freely, including work that is finished but not
# yet meant for anybody else. workflow_dispatch stays for a manual re-run.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Publishing a suite that does not load would be worse than not publishing.
      - name: verify the package before publishing
        run: |
          for f in lib/*.mjs bin/*.mjs tests/*.test.mjs tests/unit/*.test.mjs; do node --check "$f"; done
          node --test "tests/**/*.test.mjs"
          node bin/mcp-spec-test.mjs --help > /dev/null

      - name: should this run publish?
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # No token is a deliberate state, not a broken build: the repository can
          # sit for a while before anyone wants a release. Skip with a notice so
          # the run stays green and the reason is visible, rather than failing
          # until a secret appears.
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set, so nothing is published. Add the secret to enable releases."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # A tag naming one version while package.json says another would
          # publish something other than what the tag claims. That is worth
          # failing over rather than resolving in favour of either one.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAGGED="${GITHUB_REF_NAME#v}"
            if [ "$TAGGED" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          fi

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
